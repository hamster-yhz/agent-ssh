name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: false

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve build version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif (-not [string]::IsNullOrWhiteSpace($env:MANUAL_VERSION)) {
            $version = $env:MANUAL_VERSION
          } else {
            $version = (Get-Content -LiteralPath '.\VERSION' -Raw -Encoding UTF8).Trim()
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build/cache
          key: agent-ssh-${{ runner.os }}-${{ hashFiles('scripts/build-desktop.ps1', 'scripts/get-openssh.ps1') }}

      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate source syntax
        shell: pwsh
        run: |
          $files = @(
            '.\agent-ssh.ps1',
            '.\ssh.ps1',
            '.\app\server.ps1',
            '.\app\session-client.ps1',
            '.\app\session-host.ps1',
            '.\app\update.ps1',
            '.\scripts\build-desktop.ps1',
            '.\scripts\get-openssh.ps1',
            '.\scripts\build-release.ps1',
            '.\scripts\install-codex-skill.ps1',
            '.\skills\agent-ssh\scripts\find-agent-ssh.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              throw "$file has PowerShell syntax errors: $($errors.Message -join '; ')"
            }
          }
          node --check .\app\web\app.js

          . .\agent-ssh.ps1
          $descriptor = Ensure-AgentSshSessionHost
          $health = Invoke-AgentSshSessionApi $descriptor 'GET' '/health' $null 3
          if (-not $health.ok -or $health.idleTimeoutSeconds -ne 600) {
            throw 'Reusable SSH session host verification failed.'
          }
          if (-not (Stop-AgentSshSessionHostIfIdle)) {
            throw 'Reusable SSH session host did not stop cleanly.'
          }

      - name: Build release packages
        # The WinForms host targets .NET Framework and compiles through CodeDOM.
        shell: powershell
        run: .\scripts\build-release.ps1 -Version $env:APP_VERSION -RebuildDesktop

      - name: Validate PowerShell 7 runtime
        shell: pwsh
        run: |
          $port = 18787
          $server = Start-Process -FilePath (Get-Command pwsh.exe).Source -ArgumentList @(
            '-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
            '-File', (Resolve-Path '.\app\server.ps1'), '-Port', $port, '-NoBrowser'
          ) -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              if ($server.HasExited) { throw "PowerShell 7 service exited with $($server.ExitCode)." }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '<title>agent-ssh</title>') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if (-not $ready) { throw 'agent-ssh did not start under PowerShell 7.' }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Verify package isolation and installation
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $portable = Resolve-Path ".\dist\agent-ssh-$env:APP_VERSION-Portable.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead($portable)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
            foreach ($required in @(
              'agent-ssh.exe',
              'agent-ssh.ps1',
              'ssh.ps1',
              'VERSION',
              'app/session-client.ps1',
              'app/session-host.ps1',
              'app/update.ps1',
              'runtime/openssh/ssh.exe',
              'runtime/openssh/LICENSE.txt',
              'runtime/openssh/agent-ssh-version.txt',
              'skills/agent-ssh/SKILL.md',
              'skills/agent-ssh/agents/openai.yaml',
              'skills/agent-ssh/scripts/find-agent-ssh.ps1',
              'scripts/install-codex-skill.ps1'
            )) {
              if ($entries -notcontains $required) { throw "Portable package is missing $required" }
            }
            if ($entries | Where-Object { $_ -match 'servers\.local\.json' }) {
              throw 'Portable package contains a local server configuration.'
            }
            if ($entries | Where-Object { $_ -match '^(keys|data|exports|backups)/(?!.gitkeep$).+' }) {
              throw 'Portable package contains private runtime data.'
            }
            if ($entries -contains 'agent-ssh.bat') {
              throw 'Portable package still contains the retired BAT launcher.'
            }
            if ($entries | Where-Object { $_ -match 'SSH-SPACE|ssh-space' }) {
              throw 'Portable package still contains a legacy branded path.'
            }
          } finally {
            $archive.Dispose()
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'agent-ssh-install-test'
          $setup = Resolve-Path ".\dist\agent-ssh-$env:APP_VERSION-Setup.exe"
          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $installedSsh = Join-Path $installRoot 'runtime\openssh\ssh.exe'
          if (-not (Test-Path -LiteralPath $installedSsh -PathType Leaf)) {
            throw 'Installed OpenSSH runtime was not found.'
          }
          $sshVersion = & $installedSsh -V 2>&1 | Out-String
          if ($sshVersion -notmatch 'OpenSSH_for_Windows') {
            throw "Installed OpenSSH verification failed: $sshVersion"
          }
          $installedVersion = (Get-Item -LiteralPath (Join-Path $installRoot 'agent-ssh.exe')).VersionInfo.FileVersion
          if ($installedVersion -ne "$env:APP_VERSION.0") {
            throw "Installed desktop version is $installedVersion, expected $env:APP_VERSION.0"
          }
          if (Test-Path -LiteralPath (Join-Path $installRoot 'config\servers.local.json')) {
            throw 'Installer unexpectedly created a local server configuration.'
          }
          if ($env:APP_VERSION -eq '2.3.0') {
            $legacySetup = Resolve-Path ".\dist\SSH-Space-$env:APP_VERSION-Setup.exe"
            $newHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
            $legacyHash = (Get-FileHash -LiteralPath $legacySetup -Algorithm SHA256).Hash
            if ($newHash -cne $legacyHash) { throw 'Legacy update alias differs from the agent-ssh installer.' }
          }

          $uninstaller = Join-Path $installRoot 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-ssh-${{ env.APP_VERSION }}-Windows
          path: |
            dist/agent-ssh-${{ env.APP_VERSION }}-Setup.exe
            dist/agent-ssh-${{ env.APP_VERSION }}-Portable.zip
            dist/SSH-Space-${{ env.APP_VERSION }}-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @(
            ".\dist\agent-ssh-$env:APP_VERSION-Setup.exe",
            ".\dist\agent-ssh-$env:APP_VERSION-Portable.zip",
            '.\dist\SHA256SUMS.txt'
          )
          $legacySetup = ".\dist\SSH-Space-$env:APP_VERSION-Setup.exe"
          if (Test-Path -LiteralPath $legacySetup) { $files += $legacySetup }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$([Uri]::EscapeDataString($tag))"
          try {
            [void](Invoke-RestMethod -Uri $releaseUrl -Headers $headers)
            $releaseExists = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $releaseExists = $false
          }
          if ($releaseExists) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --verify-tag --generate-notes `
              --title "agent-ssh $env:APP_VERSION" --repo $env:GITHUB_REPOSITORY
          }
